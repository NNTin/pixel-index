services:
  pixel-index:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${PIXEL_INDEX_IMAGE:-pixel-index:local}
    container_name: ${SERVICE_NAME:-pixel-index}
    restart: unless-stopped
    environment:
      - SERVICE_NAME=${SERVICE_NAME:-pixel-index}
    networks:
      - pixel-index-network
      - lair-network
    labels:
      - "traefik.enable=true"
      # First-level subdomain: the Cloudflare universal cert only covers one
      # label of *.nntin.xyz, so deeper names would need ACM.
      - "traefik.http.routers.pixel-index.rule=Host(`${PIXEL_INDEX_DOMAIN:-pixel-index.nntin.xyz}`)"
      - "traefik.http.routers.pixel-index.entrypoints=websecure"
      - "traefik.http.routers.pixel-index.tls.certresolver=letsencrypt"
      - "traefik.http.services.pixel-index.loadbalancer.server.port=80"
      - "traefik.docker.network=lair-network"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/index.json > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "loki"
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-retries: "3"
        loki-batch-size: "102400"
        loki-external-labels: "service=${SERVICE_NAME:-pixel-index},component=pixel-index,environment=production"
        max-size: "10m"
        max-file: "3"
        mode: "non-blocking"

networks:
  pixel-index-network:
    external: true
    name: pixel-index-network
  lair-network:
    external: true
    name: lair-network
