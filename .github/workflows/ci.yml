name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Validate layouts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install index tooling
        run: npm ci

      # The containers cannot read the submodule's git, so the pin ships as a
      # committed file (see tools/vendor-commit.mjs). This is what stops that
      # file from quietly describing an upstream the repo no longer pins — the
      # check is the reason the file is trustworthy enough to build images from.
      - name: The vendor commit stamp matches the submodule pin
        run: npm run vendor:commit:check

      # Builds @pixel-index/layout-core, then runs its CLI over seed/.
      - name: Validate the seed layouts against the pinned Pixel Agents
        run: npm run validate

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    # Typecheck + fast tests across every workspace (layout-core, api,
    # renderer). layout-core's suite runs against the real pinned submodule
    # rather than a fixture: the point of the package is that it agrees with
    # the upstream we ship. Nothing here needs a real Postgres or a browser —
    # api's tests use a fake pool, renderer's slow browser suite is the
    # separate "renderer" job below.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install index tooling
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The detail page's live office is a second Vite entry which compiles
      # selected modules and decoded sprites from the pinned submodule. Unit
      # tests cannot prove that multi-page production bundle still assembles.
      - name: Build the web SPA
        run: npm run build --workspace @pixel-index/web

  api-e2e:
    name: API end-to-end (real Postgres + renderer + API)
    runs-on: ubuntu-latest
    # Everything in `test` above runs against a fake pool / PGlite / a
    # stubbed renderer — fast, but it never proves the actual Docker images
    # boot, migrate, and talk to each other. This does: builds the real
    # services/api and services/renderer images, brings up a real Postgres
    # alongside them, and drives the whole owner+moderator flow over real
    # HTTP. See services/api/e2e/.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install index tooling
        run: npm ci

      # typecheck:e2e/test:e2e are called workspace-scoped, which skips the
      # root's pretypecheck/pretest hooks (npm only fires "pre*" lifecycle
      # scripts for the root-level script of the same name) — build
      # layout-core explicitly instead of relying on that.
      - name: Build layout-core
        run: npm run build:core

      - name: Typecheck the e2e script itself
        run: npm run typecheck:e2e --workspace @pixel-index/api

      - name: Run the e2e suite
        run: npm run test:e2e --workspace @pixel-index/api

  renderer:
    name: Renderer integration tests
    runs-on: ubuntu-latest
    # The only job that installs a real browser. It proves both browser-backed
    # render paths: renderer determinism/concurrency/timeouts/cache/HTTP against
    # actual PNGs, and the web detail page's separate live iframe. The former
    # used to assert byte-parity against v1's static build script too; that was
    # removed in #18 along with the script.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install index tooling
        run: npm ci

      - name: Install upstream webview dependencies
        run: npm ci
        working-directory: vendor/pixel-agents

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # test:integration is workspace-scoped, which skips the root's
      # pretest hook — build layout-core explicitly (its dist is imported
      # directly by the test, not just by the renderer's own src).
      - name: Build layout-core
        run: npm run build:core

      - name: Renderer integration tests
        run: npm run test:integration --workspace @pixel-index/renderer

      # This builds the Pages-subpath production SPA, serves a mock API backed
      # by the pinned upstream default layout, then drives the live iframe in
      # this job's real Chromium. It guards the browser integration that a
      # renderer screenshot alone cannot: decoded asset sidecars, OfficeCanvas,
      # ToolOverlay CSS, postMessage, controls and persisted fallback mode.
      - name: Live layout preview end-to-end
        run: npm run test:e2e --workspace @pixel-index/web

      - name: Upload live-preview failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-preview-failure
          path: apps/web/test-results/
          if-no-files-found: ignore
