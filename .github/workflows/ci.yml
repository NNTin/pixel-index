name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Validate layouts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install index tooling
        run: npm ci

      # Builds @pixel-index/layout-core, then runs its CLI over layouts/.
      - name: Validate layouts against the pinned Pixel Agents
        run: npm run validate

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    # Typecheck + fast tests across every workspace (layout-core, api,
    # renderer). layout-core's suite runs against the real pinned submodule
    # rather than a fixture: the point of the package is that it agrees with
    # the upstream we ship. Nothing here needs a real Postgres or a browser —
    # api's tests use a fake pool, renderer's slow browser suite is the
    # separate "renderer" job below.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install index tooling
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  api-e2e:
    name: API end-to-end (real Postgres + renderer + API)
    runs-on: ubuntu-latest
    # Everything in `test` above runs against a fake pool / PGlite / a
    # stubbed renderer — fast, but it never proves the actual Docker images
    # boot, migrate, and talk to each other. This does: builds the real
    # services/api and services/renderer images, brings up a real Postgres
    # alongside them, and drives the whole owner+moderator flow over real
    # HTTP. See services/api/e2e/.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install index tooling
        run: npm ci

      - name: Typecheck the e2e script itself
        run: npm run typecheck:e2e --workspace @pixel-index/api

      - name: Run the e2e suite
        run: npm run test:e2e --workspace @pixel-index/api

  renderer:
    name: Renderer parity
    runs-on: ubuntu-latest
    # Proves the renderer still draws exactly what the v1 build script drew.
    # If this fails, previews changed for users — look at the images before
    # touching the assertion.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install index tooling
        run: npm ci

      - name: Install upstream webview dependencies
        run: npm ci
        working-directory: vendor/pixel-agents

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The reference the parity test compares against.
      - name: Render the v1 previews
        run: npm run previews

      - name: Renderer integration tests
        run: npm run test:integration --workspace @pixel-index/renderer

  previews:
    name: Render previews
    runs-on: ubuntu-latest
    # Proves every layout still renders. The images are build output, never
    # committed — the deployed site is the only place they live.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install index tooling
        run: npm ci

      - name: Install upstream webview dependencies
        run: npm ci
        working-directory: vendor/pixel-agents

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - run: node tools/build-index.mjs
      - run: node tools/render-previews.mjs
      - run: node tools/build-site.mjs

      - name: Upload gallery for review
        uses: actions/upload-artifact@v4
        with:
          name: gallery
          path: dist/
          retention-days: 7
