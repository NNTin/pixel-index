name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Validate layouts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install index tooling
        run: npm ci

      # Builds @pixel-index/layout-core, then runs its CLI over layouts/.
      - name: Validate layouts against the pinned Pixel Agents
        run: npm run validate

  test:
    name: layout-core tests
    runs-on: ubuntu-latest
    # The suite runs against the real pinned submodule rather than a fixture:
    # the point of the package is that it agrees with the upstream we ship.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install index tooling
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  previews:
    name: Render previews
    runs-on: ubuntu-latest
    # Proves every layout still renders. The images are build output, never
    # committed — the deployed site is the only place they live.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install index tooling
        run: npm ci

      - name: Install upstream webview dependencies
        run: npm ci
        working-directory: vendor/pixel-agents

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - run: node tools/build-index.mjs
      - run: node tools/render-previews.mjs
      - run: node tools/build-site.mjs

      - name: Upload gallery for review
        uses: actions/upload-artifact@v4
        with:
          name: gallery
          path: dist/
          retention-days: 7
