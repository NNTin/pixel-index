name: Enforce merge source

# main is the stable production branch (GitHub Pages + the homelab Docker
# stack) — see docs/deployment.md's "Environments" section. It should only
# ever move forward by merging a stabilized develop, never a feature branch
# directly. GitHub's ruleset "pull_request" rule can require a PR into main,
# but it has no way to restrict which branch that PR comes *from* — this job
# is that restriction, added as a required status check on main's ruleset.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

jobs:
  check-source:
    name: PR into main must come from develop
    runs-on: ubuntu-latest
    steps:
      - name: Verify head branch
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "::error::PRs into main must come from develop (got '${{ github.head_ref }}'). Merge into develop first, then open develop -> main once it's stable."
            exit 1
          fi
