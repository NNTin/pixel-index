server {
    listen 80;
    # Also bind IPv6: `localhost` resolves to ::1 first inside the container, so
    # an IPv4-only listener makes any localhost healthcheck fail with
    # "connection refused" even though the site is served fine.
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # The whole site is rebuilt on deploy, so nothing here is worth caching for
    # long: a stale index.json would list layouts whose previews have changed.
    location = /index.json {
        add_header Cache-Control "public, max-age=300";
    }

    # Previews and layout downloads are content-addressed by the index (sha256),
    # but their URLs are stable, so keep the window short enough that a redeploy
    # is picked up the same day.
    location /previews/ {
        add_header Cache-Control "public, max-age=3600";
    }
    location /layouts/ {
        add_header Cache-Control "public, max-age=3600";
        # Serve the layout as a download rather than rendering it inline.
        add_header Content-Disposition "attachment";
        default_type application/json;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
